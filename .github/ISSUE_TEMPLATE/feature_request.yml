name: Feature request
description: Ask for a new capability or a change to how a flow works
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do, and who does it?
      description: The task and the role (e.g. "a class advisor needs to mark attendance for a past period").
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How is it done today?
      description: The current steps or workaround in campus, if any.
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: College or university rule behind it
      description: Regulation clause, office practice or audit need, if any. Requests that change a decided rule (docs/rulings.md) need a ruling first.
  - type: textarea
    id: done
    attributes:
      label: How will we know it is done?
      description: Acceptance criteria as a checklist.
      placeholder: |
        - [ ] ...
