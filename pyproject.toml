[project]
name = "campus"
authors = [
    { name = "OneBook", email = "tools.zenpivot@gmail.com"}
]
description = "Higher-education layer on Frappe Education and ERPNext"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    "PyQRCode~=1.2.1",
    "pypng",
    "ortools~=9.15",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
    # campus: stylistic rules the codebase was written without; kept off so CI stays about behaviour
    "B007", # loop control variable not used
    "B010", # setattr with constant attribute
    "B905", # zip() without strict=
    "E731", # lambda assignment
    "F541", # f-string without placeholders
    "F841", # local variable assigned but never used
    "RUF002", # ambiguous unicode in docstrings (en dashes in prose)
    "RUF005", # collection literal concatenation
    "RUF007", # zip instead of itertools.pairwise
    "RUF012", # mutable class defaults (test fixtures)
    "RUF015", # list(...)[0] instead of next(iter(...))
    "RUF021", # parenthesize and/or expressions
    "RUF028", # "# fmt: skip" on a non-simple statement is ignored by the formatter
    "RUF059", # unused unpacked variable
    "RUF100", # noqa comments for rules not enabled here (BLE001) carry their reasons, so they stay
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
